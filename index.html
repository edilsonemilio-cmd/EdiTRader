<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="refresh" content="90">
  <meta name="apple-mobile-web-app-title" content="EdiTrader">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <title>EdiTrader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0b;
      color: #f2f2f2;
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #wrap {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      padding: 18px 22px 14px;
    }
    #topo {
      overflow: hidden;
    }
    #titulo {
      float: left;
      font-size: 18px;
      letter-spacing: 3px;
      color: #888;
      padding-top: 10px;
    }
    #preco {
      float: right;
      font-size: 52px;
      font-weight: bold;
      line-height: 1;
    }
    #sub {
      clear: both;
      text-align: right;
      font-size: 20px;
      margin: 6px 0 10px;
      color: #9a9a9a;
    }
    #c {
      display: block;
      width: 100%;
      height: 430px;
      background: #141414;
    }
    #rodape {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
      overflow: hidden;
    }
    #rodape span { float: left; }
    #hora { float: right; }
    .up { color: #4c4; }
    .down { color: #e55; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="topo">
      <div id="titulo">EDITRADER · BITCOIN</div>
      <div id="preco">—</div>
    </div>
    <div id="sub"></div>
    <canvas id="c" width="980" height="430"></canvas>
    <div id="rodape">
      <span>EdiTrader · atualiza sozinho</span>
      <span id="hora"></span>
    </div>
  </div>

  <script>
    var ultimo = 0;

    function getJSON(url, ok) {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4 && x.status === 200) {
          try { ok(JSON.parse(x.responseText)); } catch (e) {}
        }
      };
      x.send(null);
    }

    function brl(n) {
      var s = Math.round(n).toString();
      var out = '';
      var i, c = 0;
      for (i = s.length - 1; i >= 0; i--) {
        out = s.charAt(i) + out;
        c++;
        if (c === 3 && i > 0) { out = '.' + out; c = 0; }
      }
      return out;
    }

    function desenha(pts) {
      var cv = document.getElementById('c');
      var ctx = cv.getContext('2d');
      var w = cv.width, h = cv.height, p = 16;
      ctx.fillStyle = '#141414';
      ctx.fillRect(0, 0, w, h);
      if (!pts || pts.length < 2) return;

      var min = pts[0], max = pts[0], i;
      for (i = 1; i < pts.length; i++) {
        if (pts[i] < min) min = pts[i];
        if (pts[i] > max) max = pts[i];
      }
      if (max === min) max = min + 1;

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (i = 1; i <= 3; i++) {
        var y = p + (h - p * 2) * (i / 4);
        ctx.beginPath();
        ctx.moveTo(p, y);
        ctx.lineTo(w - p, y);
        ctx.stroke();
      }

      var sobe = pts[pts.length - 1] >= pts[0];
      ctx.beginPath();
      ctx.strokeStyle = sobe ? '#44c767' : '#e05555';
      ctx.lineWidth = 3;
      for (i = 0; i < pts.length; i++) {
        var x = p + (i / (pts.length - 1)) * (w - p * 2);
        var y = p + (1 - (pts[i] - min) / (max - min)) * (h - p * 2);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function agora() {
      var d = new Date();
      function z(n) { return n < 10 ? '0' + n : '' + n; }
      document.getElementById('hora').innerHTML =
        z(d.getHours()) + ':' + z(d.getMinutes());
    }

    function atualiza() {
      agora();
      getJSON('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT', function (t) {
        var p = parseFloat(t.price);
        document.getElementById('preco').innerHTML = 'US$ ' + brl(p);
        if (ultimo) {
          document.getElementById('preco').className = p >= ultimo ? 'up' : 'down';
        }
        ultimo = p;
      });
      getJSON('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=64', function (k) {
        var pts = [], i;
        for (i = 0; i < k.length; i++) pts.push(parseFloat(k[i][4]));
        desenha(pts);
        if (pts.length > 1) {
          var d = pts[pts.length - 1] - pts[0];
          var pct = (d / pts[0]) * 100;
          var el = document.getElementById('sub');
          el.className = d >= 0 ? 'up' : 'down';
          el.innerHTML = (d >= 0 ? '+' : '') + pct.toFixed(2) + '% nas últimas ~16 h';
        }
      });
    }

    atualiza();
    setInterval(atualiza, 30000);
    setInterval(agora, 10000);
  </script>
</body>
</html>
