<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="refresh" content="120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EdiTrader 5 MIN">
  <meta name="format-detection" content="telephone=no">
  <title>EdiTrader 5 MIN</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b0b; color: #eee; font-family: Helvetica, Arial, sans-serif; overflow: hidden; -webkit-user-select: none; }
    #wrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 12px 16px 8px; }
    #topo { overflow: hidden; height: 52px; }
    #titulo { float: left; font-size: 16px; letter-spacing: 2px; color: #888; padding-top: 14px; }
    #preco { float: right; font-size: 42px; font-weight: bold; line-height: 1.1; }
    #sub { text-align: right; font-size: 16px; color: #888; margin: 0 0 6px; clear: both; }
    #canvaswrap { position: absolute; left: 16px; right: 16px; top: 88px; bottom: 36px; }
    #c { display: block; width: 100%; height: 100%; background: #0d0d0d; }
    #rodape { position: absolute; left: 16px; right: 16px; bottom: 8px; font-size: 13px; color: #666; }
    #hora { float: right; }
    #leg { float: left; }
    .pt { display: inline-block; width: 8px; height: 8px; margin: 0 4px 0 10px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="topo">
      <div id="titulo">EDITRADER</div>
      <div id="preco">—</div>
    </div>
    <div id="sub"></div>
    <div id="canvaswrap"><canvas id="c" width="980" height="420"></canvas></div>
    <div id="rodape">
      <div id="leg">
        <span class="pt" style="background:#f1c40f"></span>M9
        <span class="pt" style="background:#e74c3c"></span>M21
        <span class="pt" style="background:#3498db"></span>M50
        <span class="pt" style="background:#fff"></span>M200
      </div>
      <div id="hora"></div>
    </div>
  </div>
  <script src="editrader-chart.js"></script>
  <script>
    iniciarQuadro({ interval: '5m', label: '5 MINUTOS', limit: 300, visivel: 72, refresh: 20000 });
  </script>
</body>
</html>
